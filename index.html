<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--accent:#0071e3}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:rgba(245,245,247,.94);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}
.wrap,main{max-width:1100px;margin:auto;padding:12px 14px}.title{font-size:21px;font-weight:750}.sub,.meta{font-size:13px;color:var(--muted)}
input{width:100%;font-size:20px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:white;margin:8px 0}
.card{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:10px}
.song{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);cursor:pointer}.song:last-child{border:0}
.num{font-size:21px;font-weight:750;min-width:52px}.grow{flex:1}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.key{font-size:28px;font-weight:760;margin-left:auto}
button{min-height:42px;border-radius:12px;border:1px solid var(--line);background:white;padding:7px 13px;font-size:15px;font-weight:650}
button.primary{background:var(--accent);border-color:var(--accent);color:white}.hidden{display:none}.score{padding:5px;overflow-x:auto}
.note{padding:9px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
#back{margin-bottom:10px}@media(max-width:620px){.key{width:100%;margin-left:0}.toolbar button{flex:1}}

.homeTools{display:flex;gap:8px;margin:8px 0 2px;flex-wrap:wrap}
.pill{min-height:36px;padding:6px 11px;border-radius:999px}
.sectionTitle{font-size:14px;font-weight:700;color:var(--muted);margin:18px 2px 6px}
.star{font-size:22px;min-width:42px;padding:0}
.keyselect{min-height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:7px 10px;font-size:16px;font-weight:650}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eee;font-size:12px;color:var(--muted);margin-left:6px}

/* iPhone / Android: retain readable score width and allow horizontal panning */
@media(max-width:680px){
 .wrap,main{padding:10px 10px}.title{font-size:19px}
 .toolbar{padding:10px;gap:7px}.toolbar .grow{flex-basis:100%}
 .toolbar .key{width:auto;flex:0 0 auto;margin-left:0;font-size:24px}
 .toolbar button{flex:1 1 auto;min-width:75px}
 .toolbar .keyselect{flex:1 1 115px;min-width:100px}
 .score{overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
 .score svg{min-width:680px!important;max-width:none!important}
}
@page{size:A4 portrait;margin:13mm 12mm}
@media print{
 html,body{background:white!important;margin:0!important;padding:0!important}
 header,#library,#back,.toolbar,#diag{display:none!important}
 main,.wrap{padding:0!important;margin:0!important;max-width:none!important}
 #viewer{display:block!important}
 #viewer .card{border:0!important;margin:0!important;border-radius:0!important;overflow:visible!important}
 #printHeading{display:block!important;font-size:15pt;font-weight:700;margin:0 0 5mm}
 .score{padding:0!important;overflow:visible!important}
 .score svg{width:100%!important;min-width:0!important;max-width:100%!important;height:auto!important;overflow:visible!important}
 button{display:none!important}
}
</style>

const natural={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const flatSpell=[["C",0],["D",-1],["D",0],["E",-1],["E",0],["F",0],["G",-1],["G",0],["A",-1],["A",0],["B",-1],["B",0]];
const sharpSpell=[["C",0],["C",1],["D",0],["D",1],["E",0],["F",0],["F",1],["G",0],["G",1],["A",0],["A",1],["B",0]];
const fifthsToMajor={"-7":"C♭","-6":"G♭","-5":"D♭","-4":"A♭","-3":"E♭","-2":"B♭","-1":"F","0":"C","1":"G","2":"D","3":"A","4":"E","5":"B","6":"F♯","7":"C♯"};
const keyToPC={"C":0,"C♯":1,"D♭":1,"D":2,"D♯":3,"E♭":3,"E":4,"F":5,"F♯":6,"G♭":6,"G":7,"G♯":8,"A♭":8,"A":9,"A♯":10,"B♭":10,"B":11};
const candidates=[{n:"C",f:0},{n:"D♭",f:-5},{n:"D",f:2},{n:"E♭",f:-3},{n:"E",f:4},{n:"F",f:-1},{n:"F♯",f:6},{n:"G♭",f:-6},{n:"G",f:1},{n:"A♭",f:-4},{n:"A",f:3},{n:"B♭",f:-2},{n:"B",f:5}];
let current=null,shift=0,originalXML="";
const $=id=>document.getElementById(id);
function decode64(s){return new TextDecoder("utf-8").decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}
function child(p,n){return Array.from(p.children).find(x=>x.localName===n)}
function setChild(p,n,v){let x=child(p,n);if(!x){x=p.ownerDocument.createElement(n);p.appendChild(x)}x.textContent=String(v)}
function all(root,n){return Array.from(root.getElementsByTagName("*")).filter(x=>x.localName===n)}
function midi(p){return 12*((+child(p,"octave").textContent)+1)+natural[child(p,"step").textContent]+(+child(p,"alter")?.textContent||0)}
function targetInfo(){
 const pc=(keyToPC[current.originalKey]+shift+120)%12;
 let opts=candidates.filter(x=>keyToPC[x.n]===pc);
 // Prefer flats when descending, sharps/naturals when ascending, while minimizing key-signature complexity.
 opts.sort((a,b)=>Math.abs(a.f)-Math.abs(b.f));
 let pick=opts[0];
 if(shift<0){let flats=opts.filter(x=>x.f<=0);if(flats.length)pick=flats.sort((a,b)=>Math.abs(a.f)-Math.abs(b.f))[0]}
 return {name:pick.n,fifths:pick.f,flat:pick.f<0};
}
function txXML(){
 const d=new DOMParser().parseFromString(originalXML,"application/xml"),info=targetInfo();
 all(d,"fifths").forEach(x=>x.textContent=String(info.fifths));
 const ps=all(d,"pitch");
 ps.forEach(p=>{const m=midi(p)+shift,pc=(m%12+12)%12,[st,al]=(info.flat?flatSpell:sharpSpell)[pc],oc=Math.floor(m/12)-1;setChild(p,"step",st);let a=child(p,"alter");if(al===0){if(a)a.remove()}else setChild(p,"alter",al);setChild(p,"octave",oc)});
 return {xml:new XMLSerializer().serializeToString(d),count:ps.length,systems:all(d,"print").filter(x=>x.getAttribute("new-system")==="yes").length,info};
}
let listMode="all";
function favs(){try{return JSON.parse(localStorage.getItem("hymnFavs")||"[]")}catch(e){return []}}
function recents(){try{return JSON.parse(localStorage.getItem("hymnRecents")||"[]")}catch(e){return []}}
function saveRecent(n){let r=recents().filter(x=>x!==n);r.unshift(n);localStorage.setItem("hymnRecents",JSON.stringify(r.slice(0,12)))}
function toggleFav(n){let f=favs();f=f.includes(n)?f.filter(x=>x!==n):[...f,n];localStorage.setItem("hymnFavs",JSON.stringify(f));updateFavButton();renderList($("search").value)}
function updateFavButton(){if(!current)return;$("favBtn").textContent=favs().includes(current.number)?"★":"☆"}
function keyOptions(){
 const opts=candidates.filter((x,i,a)=>a.findIndex(y=>y.n===x.n)===i);
 $("keySelect").innerHTML=opts.map(x=>`<option value="${x.n}">${x.n}</option>`).join("");
}
function renderList(q=""){
 q=q.trim().toLowerCase();let list=hymns.slice();
 if(listMode==="recent"){const r=recents();list=r.map(n=>hymns.find(h=>h.number===n)).filter(Boolean);$("listTitle").textContent="最近使用"}
 else if(listMode==="fav"){const f=favs();list=list.filter(h=>f.includes(h.number));$("listTitle").textContent="★ 收藏"}
 else $("listTitle").textContent="全部詩歌";
 list=list.filter(h=>!q||String(h.number).includes(q)||h.title.toLowerCase().includes(q));
 const f=favs();
 $("songs").innerHTML=list.length?list.map(h=>`<div class="song" data-n="${h.number}"><div class="num">${String(h.number).padStart(3,"0")}</div><div class="grow"><b>${h.title}</b>${f.includes(h.number)?'<span class="badge">★</span>':""}<div class="meta">原調 ${h.originalKey}</div></div><div>›</div></div>`).join(""):'<div class="note" style="border:0;padding:20px;text-align:center">目前沒有項目</div>';
 document.querySelectorAll(".song").forEach(el=>el.onclick=()=>openSong(+el.dataset.n));
}
async function draw(){
 if(!window.opensheetmusicdisplay){$("diag").textContent="無法載入樂譜引擎。請連接網路後重新開啟此檔案。";return;}
 const r=txXML();$("key").textContent=r.info.name;$("keySelect").value=r.info.name;$("score").innerHTML="";
 const osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay("score",{autoResize:true,backend:"svg",drawTitle:false,drawComposer:false,drawPartNames:false,newSystemFromXML:true,newPageFromXML:true,drawingParameters:"compacttight"});
 await osmd.load(r.xml);if(osmd.EngravingRules){
  osmd.EngravingRules.NewSystemFromXML=true;
  osmd.EngravingRules.NewPageFromXML=true;
  // Hymnal layout: stretch the last system to the same usable width as previous systems.
  if ("StretchLastSystemLine" in osmd.EngravingRules) osmd.EngravingRules.StretchLastSystemLine=true;
  if ("LastSystemMaxScalingFactor" in osmd.EngravingRules) osmd.EngravingRules.LastSystemMaxScalingFactor=10;
  if ("SystemMaxScalingFactor" in osmd.EngravingRules) osmd.EngravingRules.SystemMaxScalingFactor=10;
}
osmd.render();
// Fallback for OSMD builds that don't expose the last-system rule consistently:
// normalize SVG system width visually by making the score occupy the container width.
const svg=$("score").querySelector("svg");
if(svg){svg.style.width="100%";svg.style.height="auto";}
 $("printHeading").textContent=`${String(current.number).padStart(3,"0")}　${current.title}　｜　${r.info.name} 調`;
 $("diag").textContent=`原調 ${current.originalKey} · 目前 ${r.info.name} · ${r.count} 個 pitch · ${r.systems} 個原始換行指令`;
}
function openSong(n){
 current=hymns.find(h=>h.number===n);shift=+(localStorage.getItem("shift_"+n)||0);originalXML=decode64(current.b64);saveRecent(n);updateFavButton();
 $("songTitle").textContent=`${String(n).padStart(3,"0")}　${current.title}`;$("songMeta").textContent=`原調 ${current.originalKey}`;
 $("library").classList.add("hidden");$("viewer").classList.remove("hidden");draw().catch(e=>{$("diag").textContent="樂譜載入失敗："+e.message+"。請確認手機有網路連線，並使用 Safari 或 Chrome 開啟。";console.error(e)});
}
$("search").oninput=e=>renderList(e.target.value);
$("search").onkeydown=e=>{if(e.key==="Enter"){const q=e.target.value.trim();const h=hymns.find(x=>String(x.number)===String(parseInt(q)));if(h)openSong(h.number)}};
$("back").onclick=()=>{$("viewer").classList.add("hidden");$("library").classList.remove("hidden");$("search").focus()};
$("down").onclick=()=>{if(shift>-6){shift--;localStorage.setItem("shift_"+current.number,shift);draw()}};
$("up").onclick=()=>{if(shift<6){shift++;localStorage.setItem("shift_"+current.number,shift);draw()}};
$("reset").onclick=()=>{shift=0;localStorage.setItem("shift_"+current.number,0);draw()};

keyOptions();
$("keySelect").onchange=e=>{
 const target=keyToPC[e.target.value], origin=keyToPC[current.originalKey];
 let d=(target-origin+12)%12;if(d>6)d-=12;shift=d;
 localStorage.setItem("shift_"+current.number,shift);draw();
};
$("favBtn").onclick=()=>toggleFav(current.number);
$("printBtn").onclick=()=>{if(!current)return;window.print()};
$("showAll").onclick=()=>{listMode="all";renderList($("search").value)};
$("showRecent").onclick=()=>{listMode="recent";renderList($("search").value)};
$("showFav").onclick=()=>{listMode="fav";renderList($("search").value)};
renderList();
</script></body></html>
